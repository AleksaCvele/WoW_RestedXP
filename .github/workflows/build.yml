name: Build

# Every push: tests, the addon zip and the Windows installer (download them from the
# run's "Artifacts" section).
# Tags like v1.1.0: also macOS, then a DRAFT GitHub release with the installers, the
# auto-update file (latest.json) and SHA256SUMS.txt. Nothing reaches users until you
# review the draft and click "Publish release".
#
# Supply-chain hardening:
# * only GitHub's own actions (actions/*) are used: no third-party actions
# * the workflow token is read-only except in the release job
# * the update-signing key is only given to tag builds
# * dependency install scripts are disabled (.npmrc) and lockfiles must match

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "assets-src/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Addon checks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          luac5.1 -p addon/RestedSync/RestedSync.lua
          lua5.1 tests/addon/harness.lua > /tmp/out.lua
          diff -u tests/fixtures/RestedSync.generated.lua /tmp/out.lua
      - run: npm run package:addon
      - uses: actions/upload-artifact@v4
        with:
          name: RestedSync-addon
          path: release/RestedSync-*.zip
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: npm ci
      - name: Cargo.lock must be up to date
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installer (.exe + .msi)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: bash scripts/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: error

  # macOS runners cost 10x the Actions minutes, so only build them for tags / manual runs.
  macos:
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: npm ci
      - name: Cargo.lock must be up to date
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Build app (.dmg, Intel + Apple Silicon)
        shell: bash
        env:
          TAURI_BUILD_ARGS: --target universal-apple-darwin
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: bash scripts/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
          if-no-files-found: error

  release:
    needs: [test, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: release-in
      - name: Prepare release files (latest.json, SHA256SUMS.txt)
        run: node scripts/prepare-release.mjs release-in release-out "$GITHUB_REF_NAME"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-out/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "WoW Rested Tracker $GITHUB_REF_NAME" \
            --notes "Windows: download the .exe installer. macOS: the .dmg. WoW addon: RestedSync-*.zip.
          Verify downloads against SHA256SUMS.txt. Installed copies update themselves once this release is published."
